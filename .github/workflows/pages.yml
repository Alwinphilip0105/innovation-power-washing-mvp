name: Deploy demo to GitHub Pages

# Publishes the public site — marketing pages plus the chat and voice demos — as
# a static export. Pages has no server, so the API, sign-in and the owner
# dashboard are not part of this build; the exported pages call the full
# deployment instead (see docs/GITHUB_PAGES.md).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Work out where Pages will serve this from
        id: site
        run: |
          set -euo pipefail
          # A project site lives under /<repo>; a <user>.github.io repo and a
          # custom domain both live at the root and take no base path.
          custom='${{ vars.PAGES_URL }}'
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          repo='${{ github.event.repository.name }}'

          if [ -n "$custom" ]; then
            echo "app_url=${custom%/}" >> "$GITHUB_OUTPUT"
            echo "base_path=" >> "$GITHUB_OUTPUT"
          elif [ "$(echo "$repo" | tr '[:upper:]' '[:lower:]')" = "${owner}.github.io" ]; then
            echo "app_url=https://${owner}.github.io" >> "$GITHUB_OUTPUT"
            echo "base_path=" >> "$GITHUB_OUTPUT"
          else
            echo "app_url=https://${owner}.github.io/${repo}" >> "$GITHUB_OUTPUT"
            echo "base_path=/${repo}" >> "$GITHUB_OUTPUT"
          fi

      - run: npm ci

      # Which deployment answers this site's API calls. Defaults to the
      # current one; set the API_BASE_URL repository variable to point the
      # exported site somewhere else without touching this file.
      - name: Resolve the API origin
        id: api
        run: |
          url='${{ vars.API_BASE_URL }}'
          echo "url=${url:-https://innovation-power-washing-mvp.vercel.app}" >> "$GITHUB_OUTPUT"

      - name: Build the static export
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ steps.api.outputs.url }}
          NEXT_PUBLIC_APP_URL: ${{ steps.site.outputs.app_url }}
          PAGES_BASE_PATH: ${{ steps.site.outputs.base_path }}
        run: npm run build:static

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
